rules:
  metric_identity: resource + scope (name, version, schema url, attributes) + name; kind (not integer versus double), unit, temporality and monotonicity are identifying; description is not
  same_name_other_scope: separate metric (sdk.md, distinct meters are separate namespaces)
  identifying_conflict: report a semantic error and pass the conflicting data through; never blend fields
  description_conflict: keep the longer string
  unit_or_temporality_conflict: converting is optional (MAY), not required
  consumers: MAY reject data with semantic errors
  metric_time_zero: time_unix_nano is required, 0 SHOULD be rejected
  metric_start_zero: proto gives 0 no meaning; unknown start is expressed as start == time (reset at unknown start)
  span_ids: trace_id and span_id are invalid if all zeroes or of the wrong length (trace.proto v1.11.1); parent_span_id is empty for a root span
  span_times: start and end time are semantically required and end >= start is expected; OTLP has no unknown form for either, so a span violating this is malformed input
  log_time_zero: time_unix_nano and observed_time_unix_nano 0 mean unknown or missing
  log_observed_time: proto says MUST be set once observed by OpenTelemetry; spec says SHOULD
  log_time_missing: consumers use Timestamp, else ObservedTimestamp
  start_timestamps: new Development section in sdk.md; start is the first possible moment a measurement could have been recorded

