implementation:
  metrics:
    - instrument id hashes resource, scope and name (MetricStorageMapper.ComputeInstrumentId)
    - series id adds point attributes, kind, temporality, monotonicity, unit, so a conflict becomes a separate series
    - catalog groups by (metric_name, instrument_id) and lists Variants; headline fields come from one whole variant; description takes the longer string
    - migration re-keys legacy series atomically, preserves contradictory observations as explicit conflicts and leaves unknown scope fields NULL
    - time_unix_nano == 0 rejected through partial_success; start 0 stored as NULL; summaries retain original quantiles and reject unsupported reducers
    - authoritative metric observations preserve native exponential buckets, exact int64 values, full exemplars and instrument metadata; query projections are derived float64 data
  logs:
    - observed time is stamped once per request with the receive time only when the producer sent 0
    - log id hashes content and leaves the stamped time out (ObservedTimeProvided gate), so a retried export dedups; upsert keeps least(observed)
    - old rows keep NULL observed time
  spans:
    - primary key (project_id, trace_id, span_id); scope is correctly not part of span identity
    - scope fields stored as columns; id lengths validated (16 and 8 bytes)

gaps:
