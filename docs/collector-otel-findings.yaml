completed_persistence_invariants:
  - same metric name in two scopes gives two stored metrics and two catalog entries
  - same scope and name with different unit or kind gives separate series and a conflict, never a blended descriptor
  - description-only difference gives one entry with the longer text
  - legacy log row reads back with observed time NULL; new zero-time record gets the injected receive time
  - restart and reload keep all of the above

verification_policy: "Use the smallest relevant native check and retain failing attempts. Required release gates still run; no exclusions, fabricated success or blanket repetition of unchanged checks."
