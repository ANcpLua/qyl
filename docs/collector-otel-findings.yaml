decisions:
  # Owner confirmation supersedes the initial summary/native-histogram removal proposals.
  summaries: "retain original summary points and their quantiles; verify persistence and raw reads; unsupported aggregate reducers return an explicit error"
  exponential_histograms: "retain original native scale, offsets, positive and negative buckets, zero bucket, counts and optional aggregates; derived projection limits must never discard valid originals"
  optional_times: "log time_unix_nano becomes optional in the contract; the collector stores NULL for unknown (OTLP: 0 means unknown for logs); span times stay required"
  span_invalid_input: "revised after reading trace.proto: spans have no unknown-time form, so no NULL end and no flag; the collector rejects a span with an all-zero or wrong-length trace_id or span_id, or with end < start (including end 0), per item through partial_success (rejected_spans with a reason), and keeps the valid spans"
  unknown_times_rule: "unknown stays unknown everywhere (NULL, never 0, never an invented value); decisions optional_times and legacy_logs follow from it; it applies to logs and metrics, not to spans"
  legacy_logs: "rows with both times unknown stay out of the time-based retention sweep; check what the IngestSequence index means before choosing how they expire"
  identical_untimed_logs: "when both times are absent, add the record's position within the request to the log id hash; a retry of the same request keeps the same positions, so retries still dedup"
  partial_success_traces_logs: "per-item reject for a malformed record inside a valid batch; whole-request reject only for an undecodable payload; no contract change; also carries span_invalid_input"
  legacy_unscoped_metrics: "leave old unscoped series separate with NULL scope meaning unknown; no legacy bucket (the migration already does this); accept that one instrument may appear as two series across the migration"

