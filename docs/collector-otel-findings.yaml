    - explicit descriptor conflicts, exact series selectors and observation conflicts are verified in the focused checkpoint
    - native exponential fields and projection-unavailable diagnostics passed the focused checkpoint
    - summaries are accepted as original data; focused wire and unsupported-reducer regression passed
    - canonical observations deduplicate exact retries and preserve contradictions; measurement fingerprints exclude exemplar and metadata enrichments; regression passed
    - source verified ordinal ordering of resource, scope and point attribute maps and recursive kvlists (PersistedAttributePolicy and OtlpAttributeValue)
  logs:
    - resolved and verified in the frozen 30/30 metadata checkpoint: injected TimeProvider and exact tick-based receive time
    - request ordinal preserves multiplicity of completely untimed records and exact retries deduplicate; verified
    - original-body identity prevents false merges from equal retained prefixes; failing reproduction and passing fix retained
    - effective time remains NULL when both times are unknown; raw API, paging, streaming and time retention preserve this; verified against authentic released-v13 schema
    - the 64 KiB log-body budget counts decoded UTF-8 text and structural bytes, so JSON escaping alone cannot replace a bounded map with text; body identity is still computed before truncation
    - exact exception.message and exception.stacktrace values are sanitized in the shared incoming OTLP decoder before any persistence or metric journal; unrelated key denials retain precedence
    - 42 native HTTP/gRPC persistence cases cover 21 carriers, reopen and API readback, required credential forms, failure in either field, safe diagnostics, useful formatting and sanitize-before-truncate behavior
    - the descendant/case-variant gap failed all 42 persistence cases before the canonical-policy fix; an opaque API-key header suffix failed the same matrix before header values were redacted through line end; all failing evidence is retained
    - native application attributes retain their original types and names; explicit persistence-policy denials remain separate from vocabulary membership
  spans:
    - malformed reversed bounds and completely missing 0/0 bounds are rejected per item; a legitimate epoch start with later end remains valid; verified
    - all-zero and wrong-length identifiers are rejected per item; verified over HTTP and gRPC
    - native application attributes retain their original types and names without qyl.app prefix, scalar, key-count or length restrictions; explicit persistence-policy denials remain
    - events and links are JSON columns, not queryable or indexable by field
    - upsert replaces end, status, attributes, events, links (last write wins) but keeps start_time
    - span index performance remains an unverified lead; index count alone is not a defect and no span indexes were removed
  all_signals:
    - traces and logs preserve valid records and report per-item malformed-input rejection counts; verified over both transports
    - source verified bounded write channel and awaited writes in DuckDbStore; the original no-queue claim was false; throughput sizing remains unbenchmarked

comparison:
  otel_collector_go:
    - no storage; pipeline of receivers, processors, exporters
    - does not enforce metric identity, passes data through; qyl is stricter at storage
    - has memory_limiter, batch processor, persistent sending queue, delta/cumulative processors; qyl has none of these
  clickhouse_exporter_signoz_style:
    - stores attributes; qyl accepts native application attributes and reports explicit persistence-policy denials with a drop counter
    - separate tables per metric type including native exponential histograms
    - native nested columns for span events and links; append-only tables
    - qyl's series index plus narrow points table is close to Prometheus and Mimir label-set hashing
  duckdb_net:
    - good fit for a local-first analytic store; single writer; ART indexes plus ON CONFLICT upserts slow bulk inserts and use memory
    - benchmark actual queries and ingest before changing any span indexes; no performance claim is verified
  protobuf_grpc: Google.Protobuf with Grpc.Tools is standard; no better choice
  storage_change: native exponential histograms are already retained in DuckDB; any engine change needs an actual workload and measurements rather than an index count

