# The gate, reporting only: `mise run check` (./eng/build.sh Check) on every push to main and
# every pull request. Nothing publishes, deploys or waits for this run. A manual run with
# full=true (`gh workflow run check.yml -f full=true`) runs `mise run check-full` instead
# (NativeAOT, pack smoke, SDK proof, vocabulary smoke, coverage gate). Its
# two container stages, the collector NativeAOT smoke and the SDK container scenario, need the
# runner's Docker daemon: this run is where they run, a machine without a daemon skips them.
# A failed run keeps artifacts/logs as gate-log.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run mise run check-full instead of mise run check
        type: boolean
        default: false

permissions:
  contents: read

# A push cancels the previous push's gate, never a running full=true run.
concurrency:
  group: check-${{ github.ref }}-${{ inputs.full && 'full' || 'gate' }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.full && 60 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: NativeAOT prerequisites
        if: inputs.full
        run: |
          dpkg -s zlib1g-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev; }

      - name: Gate
        run: mise run ${{ inputs.full && 'check-full' || 'check' }}

      - name: Keep the gate log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-log
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7
