# Pull requests run Check; main pushes run CheckFull, including NativeAOT and Docker.
# Manual full=true dispatches can rerun the full check. Publication requires a successful
# full run for the exact release commit. Failed runs retain artifacts/logs as gate-log.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run mise run check-full instead of mise run check
        type: boolean
        default: false

permissions:
  contents: read

# Superseded runs cancel within the same ref and check scope.
concurrency:
  group: check-${{ github.ref }}-${{ (github.event_name == 'push' || inputs.full) && 'full' || 'gate' }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ (github.event_name == 'push' || inputs.full) && 'check-full' || 'check' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'push' || inputs.full) && 60 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: NativeAOT prerequisites
        if: github.event_name == 'push' || inputs.full
        run: |
          dpkg -s zlib1g-dev >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y --no-install-recommends zlib1g-dev; }
          docker info >/dev/null

      - name: Release publication gate tests
        run: python3 eng/scripts/test-release-publish-order.py

      - name: Gate
        run: mise run ${{ (github.event_name == 'push' || inputs.full) && 'check-full' || 'check' }}

      - name: Keep the gate log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-log
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7
