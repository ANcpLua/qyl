name: NuGet trusted publishing

# Publishing requires a human act (architecture §5): the publish lane triggers on
# version tags only. A push to main builds and verifies through ci.yml, never
# publishes. The v<version> tag must name the commit whose Version.props carries
# that exact version.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Force the publish lane (immutable-version guards still apply)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NODE_VERSION: "24"

jobs:
  version:
    name: Decide whether to publish
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          fetch-tags: true

      - name: Read version and validate the trigger
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<QylVersion>\([^<]*\)</QylVersion>.*:\1:p' Version.props)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version.props contains an invalid QylVersion: '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Pull requests validate consumers but never publish."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_publish }}" = "true" ]; then
              # The tag stays the human act: a dispatch can only re-run the lane for a
              # version already tagged on this exact commit (e.g. after a transient
              # failure). It can never mint a publish for an untagged state.
              TAG_SHA="$(git rev-list -n 1 "v$VERSION" 2>/dev/null || true)"
              if [ -z "$TAG_SHA" ]; then
                echo "No tag v$VERSION is reachable; the tag is the human act and a dispatch cannot replace it." >&2
                exit 1
              fi
              if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "Tag v$VERSION names $TAG_SHA, not the dispatched $GITHUB_SHA; refusing to publish." >&2
                exit 1
              fi
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "Forced publish re-runs the already-tagged v$VERSION on its own commit."
            else
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Manual run without force_publish verifies only."
            fi
            exit 0
          fi

          # Version-tag push: the tag is the human act that authorizes the
          # publish lane, and it must name the committed version exactly.
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version.props v$VERSION." >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Version tag $GITHUB_REF_NAME authorizes the publish lane."

  verify:
    name: Consumer smoke (${{ matrix.rid }})
    needs: version
    if: github.event_name == 'pull_request' || needs.version.outputs.publish == 'true'
    concurrency:
      group: nuget-verify-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGES: ${{ github.workspace }}/Artifacts/qyl-packages
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/qyl.dashboard/package-lock.json

      - name: Build embedded dashboard
        working-directory: services/qyl.dashboard
        run: |
          npm ci
          npm run build

      - name: Test runner contracts
        run: dotnet test tests/Qyl.Cli.Tests/Qyl.Cli.Tests.csproj --configuration Release -p:Version="$VERSION"

      - name: Pack current platform
        run: |
          RID="$(dotnet --info | awk '/ RID:/ { print $2; exit }')"
          if [ "$RID" != "${{ matrix.rid }}" ]; then
            echo "Runner resolved RID '$RID', expected '${{ matrix.rid }}'." >&2
            exit 1
          fi
          mkdir -p "$PACKAGES"
          dotnet pack packages/Qyl.Cli/Qyl.Cli.csproj --configuration Release --output "$PACKAGES" \
            -p:Version="$VERSION" -p:RepositoryCommit="$GITHUB_SHA" -p:SourceRevisionId="$GITHUB_SHA" \
            -p:ToolPackageRuntimeIdentifiers="${{ matrix.rid }}"

      - name: Install and exercise the packed tool
        # The smoke's internal phase timeouts cap it well under 5 minutes; the step limit
        # exists so a wedged run fails fast with logs instead of idling to the job timeout
        # (a macOS leg once sat 48 minutes with the step stuck in_progress and no log blob).
        timeout-minutes: 12
        env:
          # CI dogfooding: phase markers double as OTLP spans that qyl.mcp's ci_log
          # tool reads. Inert until the QYL_CI_OTLP_ENDPOINT repo variable points at
          # a reachable qyl collector ingest.
          QYL_CI_OTLP_ENDPOINT: ${{ vars.QYL_CI_OTLP_ENDPOINT }}
          QYL_CI_API_KEY: ${{ secrets.QYL_CI_API_KEY }}
          QYL_CI_RUN_ID: nuget-publish-${{ github.run_id }}
          QYL_CI_LEG: ${{ matrix.os }}
        run: dotnet run --project eng/tools/QylToolSmoke/QylToolSmoke.csproj --configuration Release -- "$PACKAGES"

      - name: Upload verified RID package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ matrix.rid }}
          path: ${{ env.PACKAGES }}/qyl.${{ matrix.rid }}.${{ env.VERSION }}.nupkg
          if-no-files-found: error

  pack:
    name: Pack release set
    needs: [version, verify]
    if: github.event_name != 'pull_request' && needs.version.outputs.publish == 'true'
    concurrency:
      group: nuget-pack-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGES: Artifacts/nuget
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/qyl.dashboard/package-lock.json

      - name: Build embedded dashboard
        working-directory: services/qyl.dashboard
        run: |
          npm ci
          npm run build

      - name: Pack all release packages
        shell: bash
        run: |
          rm -rf "$PACKAGES"
          mkdir -p "$PACKAGES"
          dotnet pack packages/Qyl.Cli/Qyl.Cli.csproj --configuration Release --output "$PACKAGES" \
            -p:Version="$VERSION" -p:RepositoryCommit="$GITHUB_SHA" -p:SourceRevisionId="$GITHUB_SHA"

      - name: Assemble RID packages from matching platform runners
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: package-*
          path: ${{ env.PACKAGES }}
          merge-multiple: true

      - name: Validate package identity and provenance
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import zipfile
          import xml.etree.ElementTree as ET

          expected = {
              "qyl",
              "qyl.linux-x64", "qyl.linux-arm64",
              "qyl.osx-x64", "qyl.osx-arm64",
              "qyl.win-x64", "qyl.win-arm64",
          }
          native = {
              "linux-x64": "libduckdb.so", "linux-arm64": "libduckdb.so",
              "osx-x64": "libduckdb.dylib", "osx-arm64": "libduckdb.dylib",
              "win-x64": "duckdb.dll", "win-arm64": "duckdb.dll",
          }
          checkpoint_native = {
              "linux-x64": "libqyl_checkpoint_native.so",
              "linux-arm64": "libqyl_checkpoint_native.so",
              "osx-x64": "libqyl_checkpoint_native.dylib",
              "osx-arm64": "libqyl_checkpoint_native.dylib",
          }
          actual = set()
          for path in glob.glob("Artifacts/nuget/*.nupkg"):
              with zipfile.ZipFile(path) as package:
                  nuspec = next(name for name in package.namelist() if name.endswith(".nuspec"))
                  root = ET.fromstring(package.read(nuspec))
                  entries = set(package.namelist())
                  if path.endswith(f"qyl.{os.environ['VERSION']}.nupkg"):
                      settings_entries = entries.intersection({
                          "tools/net10.0/any/DotnetToolSettings.xml",
                          "tools/any/any/DotnetToolSettings.xml",
                      })
                      if len(settings_entries) != 1:
                          raise SystemExit(
                              f"Outer qyl package contains {len(settings_entries)} supported tool settings entries, expected one"
                          )
                      settings = package.read(next(iter(settings_entries))).decode("utf-8-sig")
                      for rid in native:
                          route = f'RuntimeIdentifier="{rid}" Id="qyl.{rid}"'
                          if route not in settings:
                              raise SystemExit(f"Outer qyl package is missing route: {route}")
              values = {node.tag.rsplit("}", 1)[-1]: node for node in root.iter()}
              package_id = values["id"].text
              version = values["version"].text
              commit = values["repository"].attrib.get("commit")
              if package_id in actual:
                  raise SystemExit(f"Duplicate package id: {package_id}")
              if version != os.environ["VERSION"]:
                  raise SystemExit(f"{package_id} has version {version}, expected {os.environ['VERSION']}")
              if commit != os.environ["GITHUB_SHA"]:
                  raise SystemExit(f"{package_id} has repository commit {commit}, expected {os.environ['GITHUB_SHA']}")
              rid = package_id.removeprefix("qyl.")
              if rid in native:
                  prefix = f"tools/net10.0/{rid}"
                  required = {
                      f"{prefix}/DotnetToolSettings.xml",
                      f"{prefix}/collector/qyl.collector.dll",
                      f"{prefix}/collector/qyl.collector.deps.json",
                      f"{prefix}/collector/qyl.collector.runtimeconfig.json",
                      f"{prefix}/collector/{native[rid]}",
                  }
                  if rid in checkpoint_native:
                      required.add(f"{prefix}/collector/{checkpoint_native[rid]}")
                  missing = required - entries
                  if missing:
                      raise SystemExit(f"{package_id} is missing runtime entries: {sorted(missing)}")
              actual.add(package_id)
          if actual != expected:
              raise SystemExit(f"Package set mismatch. Missing={sorted(expected-actual)} Extra={sorted(actual-expected)}")
          print(f"Validated {len(actual)} packages at {os.environ['GITHUB_SHA']}.")
          PY

      - name: Exercise the complete release set
        run: dotnet run --project eng/tools/QylToolSmoke/QylToolSmoke.csproj --configuration Release -- "$PACKAGES"

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages
          path: Artifacts/nuget/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish immutable release
    needs: [version, pack]
    if: github.event_name != 'pull_request' && needs.version.outputs.publish == 'true'
    concurrency:
      group: nuget-publish-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Guard version tag
        shell: bash
        run: |
          TAG="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "$TAG already belongs to $TAG_COMMIT; bump QylVersion in Version.props." >&2
              exit 1
            fi
          fi

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Reject an immutable-version mismatch
        shell: bash
        run: |
          ids=(
            qyl.linux-x64 qyl.linux-arm64 qyl.osx-x64 qyl.osx-arm64 qyl.win-x64 qyl.win-arm64
            qyl
          )
          for id in "${ids[@]}"; do
            lower_id="${id,,}"
            remote="$RUNNER_TEMP/${lower_id}.nupkg"
            url="https://api.nuget.org/v3-flatcontainer/${lower_id}/${VERSION}/${lower_id}.${VERSION}.nupkg"
            status="$(curl --location --silent --show-error --output "$remote" --write-out '%{http_code}' "$url")"
            if [ "$status" = "404" ]; then
              continue
            fi
            if [ "$status" != "200" ]; then
              echo "NuGet returned HTTP $status for $id $VERSION." >&2
              exit 1
            fi
            COMMIT="$(REMOTE_PACKAGE="$remote" python3 - <<'PY'
          import os
          import zipfile
          import xml.etree.ElementTree as ET
          with zipfile.ZipFile(os.environ["REMOTE_PACKAGE"]) as package:
              nuspec = next(name for name in package.namelist() if name.endswith(".nuspec"))
              root = ET.fromstring(package.read(nuspec))
          repository = next(node for node in root.iter() if node.tag.rsplit("}", 1)[-1] == "repository")
          print(repository.attrib.get("commit", ""))
          PY
            )"
            if [ "$COMMIT" != "$GITHUB_SHA" ]; then
              echo "$id $VERSION is already immutable at commit '$COMMIT'; current commit is $GITHUB_SHA. Bump QylVersion in Version.props." >&2
              exit 1
            fi
          done

      # Keep OIDC authentication immediately before the push. The temporary key
      # is single-use and valid for one hour; no long-running build may follow it.
      - name: Authenticate to NuGet
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ANcpLua

      - name: Push in dependency order
        shell: bash
        run: |
          packages=(
            qyl.linux-x64 qyl.linux-arm64 qyl.osx-x64 qyl.osx-arm64 qyl.win-x64 qyl.win-arm64
            qyl
          )
          for id in "${packages[@]}"; do
            package="artifacts/${id}.${VERSION}.nupkg"
            if [ ! -f "$package" ]; then
              echo "Missing release artifact: $package" >&2
              exit 1
            fi
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Wait for the public feed
        shell: bash
        run: |
          ids=(
            qyl.linux-x64 qyl.linux-arm64 qyl.osx-x64 qyl.osx-arm64 qyl.win-x64 qyl.win-arm64
            qyl
          )
          deadline=$((SECONDS + 900))
          while true; do
            pending=()
            for id in "${ids[@]}"; do
              url="https://api.nuget.org/v3-flatcontainer/${id}/${VERSION}/${id}.${VERSION}.nupkg"
              if ! curl --fail --silent --show-error --output /dev/null "$url"; then
                pending+=("$id")
              fi
            done
            if [ ${#pending[@]} -eq 0 ]; then
              break
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "Timed out waiting for NuGet: ${pending[*]}" >&2
              exit 1
            fi
            echo "Waiting for NuGet indexing: ${pending[*]}"
            sleep 15
          done

      - name: Install and exercise public NuGet in a clean consumer
        shell: bash
        run: |
          export NUGET_PACKAGES="$RUNNER_TEMP/public-packages"
          tool="$RUNNER_TEMP/public-tool"
          deadline=$((SECONDS + 600))
          until dotnet tool install qyl --tool-path "$tool" --version "$VERSION" \
            --source https://api.nuget.org/v3/index.json --no-cache; do
            rm -rf "$tool" "$NUGET_PACKAGES"
            if [ $SECONDS -ge $deadline ]; then
              echo "Timed out installing qyl $VERSION from public NuGet." >&2
              exit 1
            fi
            sleep 15
          done
          test "$("$tool/qyl" --version)" = "$VERSION"
          dotnet run --project eng/tools/QylToolSmoke/QylToolSmoke.csproj --configuration Release -- \
            --installed "$tool/qyl" --version "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            release_args=("$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG")
            if [[ "$VERSION" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi
