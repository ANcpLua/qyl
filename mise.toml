# The pinned local build and release toolchain; `mise install` installs it. dotnet also keeps global.json, which dotnet itself reads.
[tools]
"dotnet" = "10.0.401"

[tasks.check]
description = "Full source gate when requested or needed: ./eng/build.sh Check"
quiet = true
run = "./eng/build.sh Check --Configuration Release"

[tasks.check-full]
description = "Full main-push and release gate: ./eng/build.sh CheckFull (NativeAOT, pack smoke, SDK proof, vocabulary smoke, coverage gate)"
quiet = true
run = "./eng/build.sh CheckFull --Configuration Release"
