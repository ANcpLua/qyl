# The pinned local build and release toolchain; `mise install` installs it. dotnet also keeps global.json, which dotnet itself reads.
[tools]
"dotnet" = "10.0.401"
"bun" = "1.4.3"
# bun installs and builds the dashboard; node runs the tooling its scripts call
# (tsc, vite, vitest, playwright, check-ui-discipline.mjs), inside its engines.node range.
"node" = "24.21.0"

[tasks.check]
description = "The gate before every push: ./eng/build.sh Check"
quiet = true
run = "./eng/build.sh Check --Configuration Release"

[tasks.check-full]
description = "Everything, on demand: ./eng/build.sh CheckFull (NativeAOT, pack smoke, SDK proof, dashboard e2e, vocabulary smoke)"
quiet = true
run = "./eng/build.sh CheckFull --Configuration Release"
