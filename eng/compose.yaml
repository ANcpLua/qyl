services:
  qyl-collector:
    build:
      context: ..
      dockerfile: services/qyl.collector/Dockerfile
    container_name: qyl-collector
    ports:
      # This development stack deliberately uses Unsecured OTLP, so publish only on host loopback.
      - "127.0.0.1:5100:5100"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - qyl-data:/data
    environment:
      - QYL_PORT=5100
      - QYL_BIND_ADDRESS=0.0.0.0
      - QYL_GRPC_PORT=4317
      - QYL_OTLP_PORT=4318
      - QYL_DATA_PATH=/data/qyl.duckdb
      - ASPNETCORE_URLS=http://+:5100
      # Dev stack: without this the collector fails closed at boot (Production defaults
      # OTLP auth to ApiKey and refuses to start with no keys configured). Set real keys
      # via QYL_OTLP_PRIMARY_API_KEY instead when exposing this stack beyond localhost.
      - QYL_OTLP_AUTH_MODE=Unsecured
    restart: unless-stopped
    healthcheck:
      # curl, not wget: the runtime image installs curl only.
      test: [ "CMD", "curl", "-sf", "http://localhost:5100/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # The Qyl.Api.Sdk sample: Native AOT inside the SDK image, served from a runtime-deps
  # image with no .NET runtime at all. Independent of the collector, in the same file
  # because this repository has one Compose stack.
  qyl.sample:
    build:
      context: ..
      dockerfile: samples/qyl.sample/Dockerfile
    container_name: qyl.sample
    ports:
      - "127.0.0.1:5062:8080"
    # Collector discovery probes localhost and the host name `qyl`; the collector here is `qyl-collector`,
    # so without this the sample finds nothing and the agent round-trip in the README silently records no
    # spans. QYL_ENDPOINT rather than OTEL_EXPORTER_OTLP_ENDPOINT: it names a collector for the qyl exporters
    # instead of redirecting every OTLP exporter in the process.
    environment:
      - QYL_ENDPOINT=http://qyl-collector:4318
    depends_on:
      - qyl-collector
    restart: unless-stopped

volumes:
  qyl-data:
    driver: local
